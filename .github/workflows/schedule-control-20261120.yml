name: Temporary cron control 2026-11-20

on:
  schedule:
    # TEMPORARY: standard interval control; remove at the end of this test.
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  scheduled_control:
    name: Scheduled control (logs only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record actual scheduler evidence only
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          test "$TRIGGER_EVENT" = schedule
          test "$TRIGGER_CRON" = '*/5 * * * *'
          printf 'event=%s\ncron=%s\nrun_id=%s\nhead_sha=%s\n' "$TRIGGER_EVENT" "$TRIGGER_CRON" "$GITHUB_RUN_ID" "$GITHUB_SHA"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          TZ=Asia/Shanghai date '+beijing=%Y-%m-%dT%H:%M:%S%z'
